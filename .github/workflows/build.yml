name: Build & Deploy Book

on:
  workflow_dispatch:
  repository_dispatch:
    types: [source-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Checkout private source
        uses: actions/checkout@v6
        with:
          repository: imrenhe/fin3133-investments
          token: ${{ secrets.BOOK_PUBLISH_TOKEN }}
          path: source

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Install TinyTeX
        run: quarto install tinytex --no-prompt --update-path

      - name: Render
        working-directory: source
        run: quarto render

      - uses: actions/upload-pages-artifact@v5
        with:
          path: source/_book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
